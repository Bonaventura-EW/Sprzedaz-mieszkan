# ── Polityka propagacji dla TEGO repo ─────────────────────────────────
# Ten plik ROŚNIE w czasie. To jest "pamięć granic" agenta.
# Na starcie jest prawie pusty → wszystko trafia do Ciebie jako issue.
# Zmiany w tym pliku wchodzą przez PR, który zatwierdzasz (tak jak kod).
# Zła reguła nie wślizgnie się po cichu.

repo: "Bonaventura-EW/Sprzedaz-mieszkan"          # owner/name TEGO repo
family: "sonary"        # nazwa rodziny (bracia mają tę samą)

# Rodzeństwo, którego zmiany ten repo ma przeglądać co przebieg:
siblings:
  - Bonaventura-EW/SONAR-POKOJOWY
  - Bonaventura-EW/SONAR-MIESZKANIOWY
  - Bonaventura-EW/SONAR---DZIA-KOWY
  - Bonaventura-EW/parkingi-i-garaze      # pozostałe repo z tej rodziny, po jednym w linii jako  - owner/name

# ── TWARDE GRANICE (siatka bezpieczeństwa — rusza się rzadko) ─────────
# Propagacja NIGDY nie dotyka tych ścieżek, niezależnie od werdyktu.
never_touch:
  - ".propagation/**"
  - ".github/workflows/**"
  - ".claude/**"
  #  - "src/payments/**"
  #  - "src/config/secrets*"

# ── MIĘKKA POLITYKA (to jest to, co się UCZY) ────────────────────────
# Poziom autonomii per kategoria zmiany — steruje etykietą `propagate:go`,
# która wyzwala etap implementacji (Opus):
#   ask    → issue BEZ `propagate:go`. Ty nakładasz etykietę, gdy chcesz zbudować.
#            (DOMYŚLNIE — poziom 0, Ty jesteś kontrolerem)
#   draft  → etap decyzji sam nakłada `propagate:go` → Opus pisze DRAFT PR.
#            (poziom 1 — po awansie zasłużonym w decisions.jsonl)
#   AUTO-MERGE NIE ISTNIEJE. Ostatni, nieodwracalny krok zawsze robi człowiek.
#
# MODELE: decyzje = Sonnet (claude-sonnet-5), programowanie = Opus (claude-opus-4-8).
default_autonomy: ask

# 2026-09-22 distill-policy: bugfix ma 7 rozstrzygniętych wpisów, 100%
# accepted, 0 odrzuceń bezpieczeństwa — TUŻ pod progiem awansu (≥8).
# Kolejny zaakceptowany bugfix w tym repo kwalifikuje kategorię do
# "ask → draft". Feature ma 4 rozstrzygnięcia (100% accepted) — za mało
# danych. Refactor ma 1 rozstrzygnięcie (rejected) — za mało danych.
# Żadna kategoria nie awansuje w tym przebiegu. Zobacz PR dla scorecardu.
categories: {}
  # css-refactor:   draft
  # a11y-fix:       draft
  # dependency-bump: ask

# Reguły destylowane z Twoich decyzji — dopisuje je skill `distill-policy`
# przez PR, który zatwierdzasz. Ręcznie też możesz.
learned_rules:
  - "Bugfixy poparte bezpośrednią weryfikacją problemu we własnym kodzie tego repo (nie hipotetycznym transferem z brata) są konsekwentnie akceptowane — dowody: issue#8 (coincident-marker-stacks, 884 punktów kolizji), issue#11 (measured-index-history), issue#12 (stos-pelne-szczegoly, regres we własnym świeżym kodzie), issue#14 (trend-charts-audit), issue#21 (address-precision-upgrade), issue#23 (window-balance-symmetry), issue#25 (gone-day-definition-alignment, budowa z pomiarem najpierw). 7/7 accepted, 0 odrzuceń — najbliższa awansu kategoria w repo."
  - "Feature: propozycje z gotowymi building blockami w tym repo (rozszerzenie, nie budowa od zera) są przyjmowane — dowody: issue#6 (promoted-listings-metric), issue#16 (refresh-from-listing-card, budowa z pomiarem najpierw), issue#22 (partial-day-dashed, spójność UX z resztą rodziny), issue#24 (price-change-series). 4/4 accepted, 0 odrzuceń."
  - "Refactor bez zidentyfikowanej drugiej kopii algorytmu do zsynchronizowania jest odrzucany/odkładany — dowód: issue#7 (market-ref-wspolny-modul), rejected — sprawdzenie kaskady g5 odłożone jako nie-priorytet. 0/1 accepted."
  #  - "Nie propaguj niczego, co rusza moduł auth (dotąd 0/6 przyjętych)."
  #  - "Zmiany typu css-refactor przyjmowane w 11/12 → kandydat do awansu na 'draft'."
